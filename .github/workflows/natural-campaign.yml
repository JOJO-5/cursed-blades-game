name: Natural campaign audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        profile: [orbit, projectile, summon]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:campaign -- --profile=${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natural-${{ matrix.profile }}
          path: output/playwright/v090/
